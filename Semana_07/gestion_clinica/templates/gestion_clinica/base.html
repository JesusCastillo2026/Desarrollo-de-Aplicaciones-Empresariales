<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión Clínica Veterinaria</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <!-- Encabezado / Menú -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">Clínica Veterinaria</a>
            <div>
                <a href="{% url 'crear_propietario' %}" class="btn btn-outline-light btn-sm me-2">+ Registrar Propietario</a>
                <a href="{% url 'crear_paciente' %}" class="btn btn-light btn-sm fw-semibold">+ Registrar Paciente</a>
            </div>
        </div>
    </nav>

    <!-- Contenedor Dinámico -->
    <div class="container flex-grow-1 mb-5">
        {% block content %}
        {% endblock %}
    </div>

    <!-- Pie de página -->
    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <div class="container">
            <p class="mb-0 small">© 2026 Clínica Veterinaria - Desarrollo de Aplicaciones Empresariales</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
